<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Aurea — óculos de precisão, desenhados para marcar presença." />
  <title>AUREA — O essencial, elevado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <header class="nav">
      <a class="brand" href="#top" aria-label="Aurea início">AUREA<span>.</span></a>
      <span class="nav-note">Coleção 01 · Precisão óptica</span>
    </header>

    <main class="viewport" id="top">
      <section class="copy" aria-label="Identidade da coleção Aurea">
        <div><div class="copy-rail-mark">A/01</div><div class="copy-rail-label">Optical<br />series</div></div>
        <div class="copy-meta"><span>Precision frame</span><span>2024 / 01</span></div>
      </section>

      <section class="product-stage" id="product" aria-label="Visualizador interativo do produto">
        <div class="product-frame">
          <div class="frame-tech frame-tech--top"><span>OPTICAL SERIES 01</span><span>AUREA / OBJECT 01</span></div>
          <img class="product-image" id="productImage" src="img/black_three_quarter.png" alt="Óculos Aurea na cor preto, vista três quartos" />
          <div class="frame-label"><i></i><span id="stageCaption">Preto · três quartos</span></div>
          <div class="frame-index" id="stageIndex">02 / 03</div>
          <div class="frame-tech frame-tech--bottom"><span>ENGINEERED FOR PRESENCE</span><span>2024 / 01</span></div>
        </div>

        <div class="controls" aria-label="Personalize seu Aurea">
          <div class="controls-heading"><span>Personalize</span><span>Live / 01</span></div>
          <div class="control-block">
            <span class="control-label">Tom</span>
            <div class="swatches" role="group" aria-label="Cores disponíveis">
              <button class="swatch black" data-color="black" aria-label="Preto" aria-pressed="true"></button>
              <button class="swatch white" data-color="white" aria-label="Branco" aria-pressed="false"></button>
              <button class="swatch red" data-color="red" aria-label="Vermelho" aria-pressed="false"></button>
              <button class="swatch green" data-color="green" aria-label="Verde" aria-pressed="false"></button>
            </div>
            <span class="control-label" id="selectedColor">Preto</span>
          </div>
          <div class="control-block">
            <span class="control-label">Vista</span>
            <div class="angles" role="group" aria-label="Ângulos disponíveis">
              <button class="angle" data-angle="front" aria-pressed="false">Frontal</button>
              <button class="angle is-selected" data-angle="three_quarter" aria-pressed="true">3/4</button>
              <button class="angle" data-angle="side" aria-pressed="false">Lateral</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="js/script.js" defer></script>
</body>
</html>
